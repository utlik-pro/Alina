[pytest]
# Pytest configuration for massage booking bot tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode for aiogram and async tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-config=.coveragerc
    --ignore=massage-booking-system

# Markers for test categorization.
# NOTE: this key MUST stay inside the [pytest] section — it used to sit below a
# [coverage:run] header, so pytest never registered the markers and pytest>=9.1
# failed collection under --strict-markers ("'critical' not found in markers").
# Coverage excludes live in .coveragerc (wired via --cov-config above).
markers =
    critical: Critical test scenarios from QUICK_TEST checklist
    unit: Unit tests for isolated functions
    integration: Integration tests for full workflows
    slow: Tests that take longer than 1 second
    buffering: Tests for message buffering logic
    vat: Tests for VAT calculation
