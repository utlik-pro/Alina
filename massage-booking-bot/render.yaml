services:
  - type: web
    name: crystal-lab-bot
    runtime: docker
    plan: starter
    disk:
      name: crystal-lab-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_GROUP_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: YCLIENTS_PARTNER_TOKEN
        sync: false
      - key: YCLIENTS_USER_TOKEN
        sync: false
      - key: YCLIENTS_COMPANY_ID
        sync: false
      - key: MOCK_YCLIENTS
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # WhatsApp via Wappi.pro — REQUIRED for the bot to SEND replies.
      # Without these the server receives messages but wappi_client is None
      # and every reply is silently dropped. Set values in the Render
      # dashboard (Environment tab) — they are secrets, not stored in git.
      - key: WAPPI_TOKEN
        sync: false
      - key: WAPPI_PROFILE_ID
        sync: false
      - key: WAPPI_WEBHOOK_SECRET
        sync: false
      # Optional integrations (scaffolded) — set only when going live.
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_CTA_NUMBER
        sync: false
      - key: DRIVER_TELEGRAM_CHAT_ID
        sync: false
      - key: PAYMENT_BANK_DETAILS
        sync: false
