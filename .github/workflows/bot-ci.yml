name: Bot CI (massage-booking-bot)

# Production deploys from codex/crystal-v2. Verify this exact branch and image.

on:
  push:
    branches: [ develop, master, codex/crystal-v2 ]
    paths:
      - "massage-booking-bot/**"
      - ".github/workflows/bot-ci.yml"
  pull_request:
    branches: [ develop, master, codex/crystal-v2 ]
    paths:
      - "massage-booking-bot/**"
      - ".github/workflows/bot-ci.yml"

permissions:
  contents: read

jobs:
  pytest:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: massage-booking-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            massage-booking-bot/requirements.txt
            massage-booking-bot/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.txt && pip check

      - name: Run test suite
        env:
          # Tests run fully offline: no OpenAI / YClients / Wappi calls.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          MOCK_YCLIENTS: "true"
          MOCK_WHATSAPP: "true"
          OPENAI_API_KEY: "test-key-not-used"
          TELEGRAM_BOT_TOKEN: "0:test"
        run: python -m pytest -q --no-cov-on-fail

      - name: Build production image
        run: docker build --tag crystal-bot:ci .

      - name: Start production application offline
        run: docker run --rm --network none crystal-bot:ci python scripts/check_startup.py
