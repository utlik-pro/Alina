name: Bot CI (massage-booking-bot)

# The WhatsApp agent deploys to Render from `develop` — every push there MUST
# pass the full pytest suite (282+ tests: booking gates, slot/outage handling,
# area routing incl. the daily emirate marker, DB auto-migration). The root
# ci.yml only covers the Node project on master; this job covers the bot.

on:
  push:
    branches: [ develop, master ]
    paths:
      - "massage-booking-bot/**"
      - ".github/workflows/bot-ci.yml"
  pull_request:
    branches: [ develop, master ]
    paths:
      - "massage-booking-bot/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: massage-booking-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: massage-booking-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run test suite
        env:
          # Tests run fully offline: no OpenAI / YClients / Wappi calls.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          MOCK_YCLIENTS: "true"
          MOCK_WHATSAPP: "true"
          OPENAI_API_KEY: "test-key-not-used"
          TELEGRAM_BOT_TOKEN: "0:test"
        run: python -m pytest -q --no-cov-on-fail
